name: pages
# Publiserer site/ til GitHub Pages. Kalles fra monthly.yml (pusher gjort med GITHUB_TOKEN
# starter ikke andre workflows), og kjøres ved push til main som endrer site/.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit som skal publiseres"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Sjekk at sidedata finnes
        run: |
          for f in summary portfolios frontier universe model backtest; do
            test -s "site/data/$f.json" || { echo "::error::site/data/$f.json mangler"; exit 1; }
          done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verifiser publisert side
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          check() {  # $1 = URL, $2 = tekst som må finnes
            for i in 1 2 3 4 5 6; do
              if curl -fsSL "$1" | grep -q "$2"; then echo "OK  $1"; return 0; fi
              sleep 10
            done
            echo "::error::$1 mangler eller inneholder ikke «$2»"; return 1
          }
          check "${URL}" "ETF-portefølje"
          check "${URL}data/summary.json" '"recommended"'
          check "https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js" "plotly"
          check "https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/js/tabulator.min.js" "Tabulator"
          echo "Publisert: ${URL}"
