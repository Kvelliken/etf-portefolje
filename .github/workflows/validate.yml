name: validate
# Tester ved push til arbeidsgrener. Datakildene kan probes manuelt (workflow_dispatch).
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      probe:
        description: "Kjør også probe av datakildene og en Nordnet-side"
        type: boolean
        default: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Probe datakilder
        if: inputs.probe == true
        run: |
          python scripts/probe_sources.py
          python scripts/fetch_nordnet.py --max-pages 1 --db /tmp/probe.db --no-raw
