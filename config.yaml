# Alle terskler og parametere for ETF-porteføljeverktøyet.
# Endre her, ikke i koden.

paths:
  db: data/etf.db
  raw_dir: data/raw            # rå-HTML lagres i data/raw/<YYYY-MM-DD>/page_NNN.html.gz
  price_cache: data/prices     # Parquet-cache for priser og valutakurser
  site_data: site/data

nordnet:
  url: https://www.nordnet.no/etf/liste
  page_size: 100
  delay_seconds: 1.5           # pause mellom sidekall
  timeout_seconds: 45
  retries: 4                   # forsøk per side, med økende ventetid
  max_rounds: 3                # nye runder hvis antall < total_hits (listen kan flytte seg)
  min_fraction_of_previous: 0.90   # sikkerhetssjekk: avbryt hvis færre enn 90 % av forrige aktive
  raw_keep_months: 6           # behold rå-HTML for de siste N månedene (0 = behold alt)
  # Ekstra URL-parametere. Nordnet tar sortField/sortOrder (ikke sort_attribute) og
  # oversetter til sort_attribute=name i API-kallet. Sortering på navn gir stabil sideinndeling
  # (standard er 1 års avkastning, som kan flytte rader mellom sider underveis). Verifisert 2026-10-07.
  list_params: {sortField: name, sortOrder: asc}

funds:
  # Verdipapirfond (ikke børsnotert) fra Nordnets fondsliste. Antatt samme innebygde JSON som
  # ETF-listen, så parser, database og diff gjenbrukes. Øvrige henteparametere tas fra `nordnet`.
  # Hentes med `python scripts/fetch_nordnet.py --fond`.
  url: https://www.nordnet.no/fond/liste
  db: data/fond.db
  raw_dir: data/raw_fond
  last_fetch: data/last_fetch_fond.json
  probe:
    report_dir: data/funds       # probe_report.json og probe_details.csv
    sample: 200                  # antall ISIN-er i utvalget (0 = alle), stratifisert på fondstype
    seed: 1
    # Kontroll av at Yahoo-tickeren er riktig andelsklasse: Yahoos kursavkastning mot Nordnets
    # yield_1y/yield_3y. For fond er Nordnets avkastning i NOK også for fond i USD/EUR/SEK (verifisert
    # 2026-11: 82 % innen 2 pp i NOK, 0 % i fondets valuta), så Yahoo-kursen regnes om til NOK med
    # Norges Banks kurser. (For ETF-er er Nordnets yield_1y kursavkastning i noteringsvalutaen.)
    tol_1y_pp: 2.0
    tol_3y_pp: 5.0
    price_ratio_tol: 0.03        # siste Yahoo-kurs mot Nordnets kurs (samme valuta), maks avvik
    history_days: 1200           # dager med dagskurser som hentes til kontrollen (3 år + slakk)

account:
  type: ASK                    # ASK eller ordinær (AF). Utenfor ASK vises skatteadvarsel.
  # ASK tillater bare fond hjemmehørende i EØS. Utledes fra ISIN-landkoden.
  # "NO" må stå i anførselstegn: YAML leser ellers NO som false (alle norske fond ble ikke-ASK).
  ask_countries: [AT, BE, BG, CY, CZ, DE, DK, EE, ES, FI, FR, GR, HR, HU, IE, IS, IT, LI,
                  LT, LU, LV, MT, NL, "NO", PL, PT, RO, SE, SI, SK]
  prefer_accumulating: true    # foretrekk akkumulerende andelsklasse ved representantvalg

tickers:
  # ISIN -> Yahoo-ticker. Kandidater: Nordnet-symbol + børssuffiks, Yahoo-søk på ISIN, OpenFIGI.
  # Kandidaten med flest måneder med kurs (lengst og mest komplett historikk) velges.
  recheck_days: 180            # slå opp på nytt når mappingen er eldre enn dette (eller mangler)
  max_candidates: 8            # maks antall kandidater som prøves per ISIN
  max_stale_days: 30           # siste kurs må være nyere enn dette for at en ticker godtas
  # OpenFIGI brukes bare når ingen Nordnet-/søkekandidat dekker fondets startdato (± slakk).
  # Yahoo har lite dagsdata før yahoo_history_floor, så eldre startdatoer regnes fra den.
  start_slack_days: 120
  yahoo_history_floor: "2008-01-01"
  # Nordnets børskode (siste ledd i display_slug) -> Yahoo-suffiks
  nordnet_suffix: {xeta: .DE, xsto: .ST, xcse: .CO, xosl: .OL, xhel: .HE, xetr: .DE}
  # OpenFIGI/Bloomberg exchCode -> Yahoo-suffiks, i prioritert rekkefølge
  figi_suffix: {GY: .DE, LN: .L, NA: .AS, FP: .PA, IM: .MI, SW: .SW, SE: .SW, SS: .ST, DC: .CO,
                NO: .OL, FH: .HE, BB: .BR, SM: .MC, AV: .VI, ID: .IR, GF: .F, GS: .SG, GM: .MU,
                GD: .DU, GB: .BE, GH: .HM}
  openfigi_url: https://api.openfigi.com/v3/mapping
  openfigi_batch: 10           # jobber per kall uten API-nøkkel (100 med OPENFIGI_API_KEY)
  openfigi_delay_seconds: 2.6  # uten nøkkel: 25 kall/min
  yahoo_search: true           # bruk Yahoos søk på ISIN som ekstra kandidatkilde

prices:
  yahoo_hosts: [query2.finance.yahoo.com, query1.finance.yahoo.com]
  threads: 4                   # samtidige kall mot Yahoo
  delay_seconds: 0.25          # pause per kall per tråd
  timeout_seconds: 30
  retries: 4
  overlap_days: 14             # hent litt bakover ved inkrementell oppdatering
  fx_source: norges_bank       # norges_bank eller yahoo (EURNOK=X osv.)
  fx_start: "1999-01-01"
  # Fjern kurser som avviker mer enn faktor spike_ratio fra BÅDE medianen av de 10 foregående og
  # de 10 neste kursene (feilkurser og korte falske nivåer). 100x-hopp (GBp/GBP) rettes.
  spike_ratio: 1.3
  # Gjenstående døgnhopp større enn faktor jump_ratio regnes som datafeil: historikken før siste
  # slike hopp kuttes (kortere, ren historikk er bedre enn lengre, skitten). 0 = av.
  jump_ratio: 1.3
  min_years_report: [1, 3, 5, 10]   # historikklengder i dekningsrapporten

universe:
  # Lag 1: én notering per ISIN. Foretrukket valuta i rekkefølge, deretter lavest spread, flest eiere.
  listing_currency_preference: [NOK, EUR, SEK, DKK, USD]
  # Lag 2: tracking error (TE) på avkastning i NOK, complete linkage.
  # Månedlig (ME) i stedet for ukentlig: støy i sluttkursene (spread, valutakurs fastsatt 14:15 mot
  # sluttkurs 17:30 for noteringer i ulik valuta) gir falsk TE ved hvert målepunkt og annualiseres
  # med sqrt(52) ukentlig mot sqrt(12) månedlig. W-FRI kan velges.
  te_frequency: ME
  # Periodens sluttkurs = snitt av de siste N dagskursene (demper dag-til-dag-støy, se universe.py).
  te_smooth_days: 5
  te_window_periods: 60        # bruk bare de siste 60 månedene (dagens fondsoppsett, unngår gammel feildata)
  # Terskel valgt fra data (2026-10): samme indeks 0,1–0,85 % (World 0,2, S&P 500 0,1–0,6, MSCI Korea
  # 0,73–0,83, MSCI Taiwan 0,5); ulike indekser fra 1,2 % (EM/EM IMI 1,2, World/ACWI 1,3,
  # FTSE/MSCI Korea 1,45, S&P 500/World 2,9). 0,75 % splitter Korea-ETF-ene.
  te_threshold: 0.01
  te_thresholds_report: [0.005, 0.0075, 0.01, 0.0125]
  min_overlap: 12              # perioder (måneder) med felles data som kreves for å kunne slå sammen
  robust_te: true              # vinsoriser avkastningsdifferansen ved median ± 4·MAD-sigma per par
  robust_clip_sigma: 4.0
  robust_prefilter_te: 0.25    # bare par med vanlig TE under dette beregnes robust
  # Lag 3: representant per klynge.
  min_history_years: 5         # krav for å kunne velges som representant / optimeres
  exclude_categories: ["Trading Tools"]
  exclude_name_regex: "leverag|\\b[2-5]x\\b|\\(-?[1-5]x\\)|short|invers|\\bbear\\b|\\bbull\\b"
  # Valutasikret (bare informasjon; sikret og usikret skilles av TE). «Tail Hedge» er ikke valutasikring.
  hedged_name_regex: "(?<!tail )hedg|\\bhdg\\b|\\bhgd\\b|pfhdg"
  dist_fee_penalty: 0.10       # utdelende regnes som +0,10 pp avgift når prefer_accumulating (ASK)
  hysteresis_fee_pp: 0.05      # bytt bare representant hvis ny er minst 0,05 pp billigere (effektiv avgift)
  report_dir: data/universe

site:
  # Standardverdier på nettsiden (kan endres der). Nøkkeltall, optimering og backtest regnes i nettleseren
  # fra månedlig totalavkastning i NOK (site/data/returns.json).
  benchmark_isin: IE00B6R52259   # verdens-ETF som referanse (iShares MSCI ACWI); velg en annen på siden
  market_risk_premium: 0.045     # forventet årlig meravkastning for referansen utover risikofri (likevektsprior)
  history_weight: 0.25           # andel historisk snitt i forventet avkastning (0 = ren likevekt, 1 = ren historikk)
  estimation_years: 5            # år med månedsdata til kovarians/forventning i optimeringen
  default_min_weight: 0.0        # standard minstevekt per ETF i utvalget
  default_max_weight: 0.40       # standard maksvekt per ETF i utvalget
  trading_cost_pct: 0.25         # kostnad per handel i backtesten, % av handlet beløp (kurtasje + halv spread + valuta)
  rebalance_band_pp: 5           # ombalansering: «ingen handel nødvendig» når alle vekter er innenfor ±5 pp
  portfolio_value_nok: 500000    # standard porteføljeverdi i ombalanseringen
